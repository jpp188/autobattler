<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#120c1c" />
    <title>Packbound</title>
    <style>
      @font-face {
        font-family: 'PressStart2P';
        src: url('./fonts/PressStart2P.woff2') format('woff2');
        font-display: block;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #07050b;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }
      @font-face {
        font-family: 'Tiny5';
        src: url('./fonts/Tiny5.woff2') format('woff2');
        font-display: block;
      }
      #fontwarm {
        font-family: 'PressStart2P';
        position: absolute;
        left: -9999px;
        font-size: 8px;
      }
    </style>
  </head>
  <body>
    <div id="fontwarm">Packbound <span style="font-family: Tiny5">Packbound</span></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
